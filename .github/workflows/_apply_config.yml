name: _apply_config
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUBURL: ${{ secrets.CONFIG_SUBSCRIPTION_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Install wrangler
        run: npm i -g wrangler@4.60.0 >/dev/null 2>&1

      - name: Patch D1 database id
        run: sed -i "s/REPLACE_WITH_YOUR_D1_DATABASE_ID/${{ secrets.D1_DATABASE_ID }}/g" wrangler.toml

      - name: Snapshot admin_config (before)
        run: |
          wrangler d1 execute moontvplus --remote --json \
            --command "SELECT config FROM admin_config WHERE id=1;" > /tmp/c.json
          echo "--- BEFORE ---"
          python3 _ghcfg/verify_cfg.py /tmp/c.json || true

      - name: Apply playback sources into D1
        run: |
          set -e
          curl -sL --max-time 30 "$SUBURL" -o /tmp/enc.b58
          python3 _ghcfg/build_update.py
          wrangler d1 execute moontvplus --remote --file=/tmp/update.sql

      - name: Verify admin_config (after)
        run: |
          wrangler d1 execute moontvplus --remote --json \
            --command "SELECT config FROM admin_config WHERE id=1;" > /tmp/c2.json
          echo "--- AFTER ---"
          python3 _ghcfg/verify_cfg.py /tmp/c2.json
