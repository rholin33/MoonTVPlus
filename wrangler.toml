name = "moontv-plus"
compatibility_date = "2024-09-23"
# global_fetch_strictly_public: required so this Worker can fetch another
# Worker on the same zone (danmu-api.tarysoli33.workers.dev). Without it,
# such requests are routed to the zone origin and return 404 (CF error 1042).
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
main = ".open-next/worker.js"
minify = true

# 静态资源配置
# Cloudflare Workers Assets 用于服务静态文件
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "moontvplus"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[vars]
NODE_ENV = "production"
BUILD_TARGET = "cloudflare"
