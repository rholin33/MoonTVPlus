name: _diag
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  q:
    runs-on: ubuntu-latest
    steps:
      - name: Install Wrangler
        run: npm i -g wrangler@4.60.0
      - name: Query admin_config
        run: |
          echo "=== row count / size ==="
          wrangler d1 execute moontvplus --remote --command "SELECT id, length(config) AS len, datetime(updated_at,'unixepoch') AS updated FROM admin_config;" || true
          echo "=== does config contain api_site? ==="
          wrangler d1 execute moontvplus --remote --json --command "SELECT config FROM admin_config;" > /tmp/c.json || true
          head -c 2000 /tmp/c.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
