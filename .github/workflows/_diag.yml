name: _diag
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  q:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm i -g wrangler@4.60.0
      - run: sed -i "s/REPLACE_WITH_YOUR_D1_DATABASE_ID/${{ secrets.D1_DATABASE_ID }}/g" wrangler.toml
      - name: Dump config as base64
        run: |
          wrangler d1 execute moontvplus --remote --json \
            --command "SELECT config FROM admin_config WHERE id=1;" > /tmp/c.json || true
          python3 -c "
import json,base64
d=json.load(open('/tmp/c.json'))
c=d[0]['results'][0]['config']
print('LEN',len(c))
print('B64',base64.b64encode(c.encode()).decode())
"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
