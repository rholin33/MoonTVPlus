name: _set_danmaku
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DM_BASE: ${{ secrets.DANMAKU_API_BASE }}
      DM_TOKEN: ${{ secrets.DANMAKU_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install wrangler
        run: npm i -g wrangler@4.60.0 >/dev/null 2>&1

      - name: Patch D1 database id
        run: sed -i "s/REPLACE_WITH_YOUR_D1_DATABASE_ID/${{ secrets.D1_DATABASE_ID }}/g" wrangler.toml

      - name: Snapshot admin_config
        run: |
          wrangler d1 execute moontvplus --remote --json \
            --command "SELECT config FROM admin_config WHERE id=1;" > /tmp/c.json
          echo "--- BEFORE ---"
          python3 _ghcfg/snap_danmaku.py

      - name: Patch danmaku settings
        run: |
          set -e
          python3 _ghcfg/set_danmaku.py
          wrangler d1 execute moontvplus --remote --file=/tmp/update_dm.sql

      - name: Verify
        run: |
          wrangler d1 execute moontvplus --remote --json \
            --command "SELECT config FROM admin_config WHERE id=1;" > /tmp/c.json
          echo "--- AFTER ---"
          python3 _ghcfg/verify_danmaku.py
