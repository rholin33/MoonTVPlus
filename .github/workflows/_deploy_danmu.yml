name: _deploy_danmu
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DANMAKU_TOKEN: ${{ secrets.DANMAKU_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy danmu_api to Cloudflare Workers
        run: bash _ghcfg/deploy_danmu.sh
      - name: End-to-end danmaku verification
        run: python3 _ghcfg/verify_danmu.py
